name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - uses: actions/checkout@v4
      - name: Build and Push the Docker image
        run: |
          docker build ./ssr --tag ${{ secrets.DOCKER_USERNAME }}/the_tulsi_interface_home_image
          docker push ${{ secrets.DOCKER_USERNAME }}/the_tulsi_interface_home_image

      - name: ssh
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{secrets.SSH_HOST}}
          username: ubuntu
          key: ${{secrets.SSH_KEY}}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/the_tulsi_interface_home_image
            docker stop productionClientHome
            docker rm productionClientHome
            docker run -d -p8001:3000 --name productionClientHome --rm ${{ secrets.DOCKER_USERNAME }}/the_tulsi_interface_home_image
            docker system prune -af
